  version: '1'
  description: Datacircle is a data co-op.
  termsOfService: https://datacircle.dev/terms
  contact:
    name: Datacircle
    url: https://datacircle.dev
    email: wayne@datacircle.dev
  x-logo:
    url: https://datacircle.dev/favicon.png
    altText: Datacircle
servers:
- url: https://api.datacircle.dev
security:
- token: []
tags:
- name: HarvestAPI
  description: 'LinkedIn Profile API: HarvestAPI''s own request, sent to api.datacircle.dev with your Datacircle key and `X-Data-Provider: harvestapi`.'
paths:
  /linkedin/profile:
    get:
      tags:
      - HarvestAPI
      summary: Get one LinkedIn profile
      description: 'Send HarvestAPI''s own request (`GET https://api.harvest-api.com/linkedin/profile`) to api.datacircle.dev, with your Datacircle key in `Authorization` and `X-Data-Provider: harvestapi`. The path and the query stay the same. We charge $0.0037 per profile HarvestAPI finds, with no markup.


        A profile HarvestAPI doesn''t find costs $0.0023.'
      parameters:
      - name: url
        in: query
        required: true
        description: The profile's LinkedIn URL, e.g. `https://www.linkedin.com/in/williamhgates`. The only HarvestAPI parameter Datacircle passes on.
        schema:
          type: string
        example: https://www.linkedin.com/in/williamhgates
      - name: X-Data-Provider
        in: header
        required: true
        description: 'Names the provider: `harvestapi`. This header and the host are the only changes from the provider''s own request.'
        schema:
          type: string
          enum:
          - harvestapi
          default: harvestapi
        example: harvestapi
      x-codeSamples:
      - lang: bash
        label: curl
        source: "curl \"https://api.datacircle.dev/linkedin/profile?url=https://www.linkedin.com/in/williamhgates\" \\\n  -H \"Authorization: Token $DATACIRCLE_API_KEY\" \\\n  -H \"X-Data-Provider: harvestapi\""
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresponse = requests.get(\n    \"https://api.datacircle.dev/linkedin/profile\",\n    headers={\"Authorization\": f\"Token {os.environ['DATACIRCLE_API_KEY']}\", \"X-Data-Provider\": \"harvestapi\"},\n    params={'url': 'https://www.linkedin.com/in/williamhgates'},\n)\nprint(response.json())"
      responses:
        '200':
          description: 'HarvestAPI''s answer plus `datacircle_meta`, as HarvestAPI sends it: a `200` whether it found the profile (`status: 200`, \$0.0037) or not (`element: null`, `status: 404`, `error: Profile not found`, \$0.0023: HarvestAPI bills the lookup)'
