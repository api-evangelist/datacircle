            application/json:
              schema:
                $ref: '#/components/schemas/HarvestApiProfileResponse'
              example:
                element:
                  id: …
                  publicIdentifier: …
                  linkedinUrl: https://www.linkedin.com/in/williamhgates
                  firstName: …
                  lastName: …
                  emails: []
                  headline: …
