aid: datacircle
name: Datacircle
image: https://datacircle.dev/og-co-op.jpg
description: 'Datacircle is a B2B data co-op API: customers send the original request of a supported data provider (currently the Up2Data, HarvestAPI
  and Fetchin LinkedIn profile APIs) to api.datacircle.dev with a Datacircle key at the provider''s own price with no markup, and receive a daily
  flat file of pooled co-op data. It also ships a remote MCP server at api.datacircle.dev/mcp.'
