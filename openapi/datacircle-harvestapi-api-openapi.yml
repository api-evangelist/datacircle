                    schoolLinkedinUrl: …
                    schoolId: …
                    degree: null
                    fieldOfStudy: null
                    period: …
                    startDate:
                      year: 0
                      text: …
                    endDate:
                      year: 0
                      text: …
                    schoolLogo:
                      url: …
                      sizes:
                      - url: …
                        width: 0
                        height: 0
                  profileActions:
                  - label: …
