                  connectionsCount: 0
                  followerCount: 0
                  verified: true
                  about: …
                  industry:
                    id: 0
                    name: …
                  currentPosition:
                  - position: …
                    location: null
                    employmentType: null
                    workplaceType: null
                    companyName: …
