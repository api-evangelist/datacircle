                retries: 0
                payments:
                - linkedinProfile
                originalQuery:
                  url: https://www.linkedin.com/in/williamhgates
                cost: 0.0037
                entityId: …
                datacircle_meta:
                  provider: harvestapi
                  cost_usd: 0.0037
                  balance_usd: 4.9963
        '400':
          description: 'Not charged, nothing sent to HarvestAPI: no `url`, a `url` that isn''t a LinkedIn profile URL (`https://www.linkedin.com/in/<slug>`), a query parameter other than `url`, or an `X-Data-Provider` value that isn''t `up2data`, `harvestapi` or `fetchin`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Balance too low
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - balance_usd
                properties:
                  error:
                    type: string
                    description: 'Why the call was refused: your balance can''t cover it. Not charged.'
                  balance_usd:
                    type: number
                    description: Your balance now, in dollars (`balance_usd` in `GET /balance/`). `POST /checkout/` adds funds.
                additionalProperties: false
        '404':
          description: 'No `X-Data-Provider` header, or a path Datacircle doesn''t call for that provider (e.g. `X-Data-Provider: up2data` on `/linkedin/profile`). Not charged'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 'HarvestAPI''s own server failed: its error passes on as it came, with its status (`503` and `504` too). Not charged. Send the same request again.'
        '503':
          description: 'HarvestAPI hasn''t answered within 45 s, can''t be reached, or refused Datacircle''s own account with it: Datacircle stops waiting. Not charged. Send the same request again.'
          content:
            application/json:
              schema:
                type: object
                description: Datacircle's own answer when the provider hasn't answered within 45 s, retries included, or can't be reached. Not charged.
                required:
                - error
                - balance_usd
                properties:
                  error:
                    type: string
                    description: What went wrong, in plain words.
                  balance_usd:
                    type: number
                    description: Your balance now, in dollars (`balance_usd` in `GET /balance/`).
                additionalProperties: false
      operationId: getLinkedinProfile
      x-operation-id-source: derived
components:
  schemas:
    HarvestApiProfile:
      type: object
      properties:
        about:
          type:
          - string
          - 'null'
          description: The profile's About section.
        causes:
          type: array
          items:
            type: string
          description: The causes the member cares about, e.g. `Education`.
        certifications:
          type: array
          items:
            type: object
            properties:
              issuedAt:
                type:
                - string
                - 'null'
                description: When, as LinkedIn shows it, e.g. `Issued Jul 1998 · Expired Jul 2018`.
              issuedBy:
                type:
                - string
                - 'null'
                description: Who issued it.
              issuedByLink:
                type:
                - string
                - 'null'
                description: The issuer's LinkedIn page.
              issuedByLogo:
                type: object
                properties:
                  sizes:
                    type: array
                    items:
                      type: object
                      properties:
                        height:
                          type: integer
                          description: Height, in pixels.
                        url:
                          type: string
                          description: The image's URL.
                        width:
                          type: integer
                          description: Width, in pixels.
                      required:
                      - height
                      - url
                      - width
                      additionalProperties: false
                    description: Every size LinkedIn serves.
                  url:
                    type:
                    - string
                    - 'null'
                    description: The image's URL.
                required:
                - sizes
                - url
                additionalProperties: false
                description: 'The issuer''s logo: `url` (the largest image) and `sizes`, every size LinkedIn serves.'
              link:
                type:
                - string
                - 'null'
                description: The certificate's own URL.
              title:
                type: string
                description: The certification.
            required:
            - issuedAt
            - issuedBy
            - issuedByLogo
            - title
            additionalProperties: false
          description: Licenses and certifications.
        composeOptionType:
          type:
          - string
          - 'null'
          description: How LinkedIn lets someone not connected write to the member, e.g. `PREMIUM_INMAIL`.
        connectionsCount:
          type:
          - integer
          - 'null'
          description: The member's connections, as LinkedIn counts them (it shows `500+` past 500).
        courses:
          type: array
          items:
            type: object
            properties:
              associatedWith:
                type:
                - string
                - 'null'
                description: The job or school it came with.
              associatedWithLink:
                type:
                - string
                - 'null'
                description: That job's or school's LinkedIn page.
              number:
                type:
                - string
                - 'null'
                description: The course's number.
              title:
                type: string
                description: The course.
            required:
            - associatedWith
            - associatedWithLink
            - number
            - title
            additionalProperties: false
          description: Courses.
        coverPicture:
          type:
          - object
          - 'null'
          properties:
            sizes:
              type: array
              items:
                type: object
                properties:
                  height:
                    type: integer
                    description: Height, in pixels.
                  url:
                    type: string
                    description: The image's URL.
                  width:
                    type: integer
                    description: Width, in pixels.
                required:
                - height
                - url
                - width
                additionalProperties: false
              description: Every size LinkedIn serves.
            url:
              type:
              - string
              - 'null'
              description: The image's URL.
          required:
          - sizes
          - url
          additionalProperties: false
          description: 'The banner image behind the photo: `url` (the largest image) and `sizes`, every size LinkedIn serves.'
        creator:
          type: boolean
          description: '`true` when the member has creator mode on.'
        currentPosition:
          type: array
          items:
            type: object
            properties:
              companyId:
                type:
                - string
                - 'null'
                description: LinkedIn's numeric id of the company.
              companyLinkedinUrl:
                type:
                - string
                - 'null'
                description: The company's LinkedIn page.
              companyLogo:
                type:
                - object
                - 'null'
                properties:
                  sizes:
                    type: array
                    items:
                      type: object
                      properties:
                        height:
                          type: integer
                          description: Height, in pixels.
                        url:
                          type: string
                          description: The image's URL.
                        width:
                          type: integer
                          description: Width, in pixels.
                      required:
                      - height
                      - url
                      - width
                      additionalProperties: false
                    description: Every size LinkedIn serves.
                  url:
                    type: string
                    description: The image's URL.
                required:
                - sizes
                - url
                additionalProperties: false
                description: 'The company''s logo: `url` (the largest image) and `sizes`, every size LinkedIn serves.'
              companyName:
                type: string
                description: The company's name.
              companyUniversalName:
                type:
                - string
                - 'null'
                description: 'The company''s slug: `linkedin.com/company/<companyUniversalName>`.'
              description:
                type:
                - string
                - 'null'
                description: Its description, as written on the profile.
              duration:
                type:
                - string
                - 'null'
                description: How long, as LinkedIn shows it, e.g. `16 yrs 4 mos`.
              employmentType:
                type:
                - string
                - 'null'
                description: Employment type, e.g. `Full-time` or `Self-employed`.
              endDate:
                type: object
                properties:
                  text:
                    type: string
                    description: The date as LinkedIn shows it.
                required:
                - text
                additionalProperties: false
                description: 'When it ended. `text` is `Present` for a current one: `text` as LinkedIn shows it (e.g. `Jun 2010`), with `year` and `month` when LinkedIn gives them.'
              experienceGroupId:
                type:
                - string
                - 'null'
                description: 'Groups several jobs at the same company: equal on each.'
              location:
                type:
                - string
                - 'null'
                description: Where the job is.
              position:
                type: string
                description: The job title.
              skills:
                type:
                - array
                - 'null'
                items:
                  type: string
                description: The skills listed with it.
              startDate:
                type:
                - object
                - 'null'
                properties:
                  month:
                    type: string
                    description: The month, e.g. `Jun`.
                  text:
                    type: string
                    description: The date as LinkedIn shows it.
                  year:
                    type: integer
                    description: The year.
                required:
                - text
                - year
                additionalProperties: false
                description: 'When it started: `text` as LinkedIn shows it (e.g. `Jun 2010`), with `year` and `month` when LinkedIn gives them.'
              workplaceType:
                type:
                - string
                - 'null'
                description: Where the role is worked, e.g. `On-site`, `Hybrid` or `Remote`.
            required:
            - companyId
            - companyLinkedinUrl
            - companyLogo
            - companyName
            - companyUniversalName
            - description
            - duration
            - employmentType
            - endDate
            - location
            - position
            - skills
            - startDate
            - workplaceType
            additionalProperties: false
          description: The member's current jobs, the same shape as `experience`.
        education:
          type: array
          items:
            type: object
            properties:
              degree:
                type:
                - string
                - 'null'
                description: The degree.
              description:
                type:
                - string
                - 'null'
                description: Its description, as written on the profile.
              endDate:
                type:
                - object
                - 'null'
                properties:
                  month:
                    type:
                    - string
                    - 'null'
                    description: The month, e.g. `Jun`.
                  text:
                    type: string
                    description: The date as LinkedIn shows it.
                  year:
                    type: integer
                    description: The year.
                required:
                - text
                - year
                additionalProperties: false
                description: 'When it ended. `text` is `Present` for a current one: `text` as LinkedIn shows it (e.g. `Jun 2010`), with `year` and `month` when LinkedIn gives them.'
              fieldOfStudy:
                type:
                - string
                - 'null'
                description: The field of study.
              insights:
                type:
                - string
                - 'null'
                description: Activities and societies, as written on the profile.
              period:
                type:
                - string
                - 'null'
                description: When, as LinkedIn shows it, e.g. `1981 - 1985`.
              schoolId:
                type:
                - string
                - 'null'
                description: LinkedIn's numeric id of the school.
              schoolLinkedinUrl:
                type:
                - string
                - 'null'
                description: The school's LinkedIn page.
              schoolLogo:
                type:
                - object
                - 'null'
                properties:
                  sizes:
                    type: array
                    items:
                      type: object
                      properties:
                        height:
                          type: integer
                          description: Height, in pixels.
                        url:
                          type: string
                          description: The image's URL.
                        width:
                          type: integer
                          description: Width, in pixels.
                      required:
                      - height
                      - url
                      - width
                      additionalProperties: false
                    description: Every size LinkedIn serves.
                  url:
                    type:
                    - string
                    - 'null'
                    description: The image's URL.
                required:
                - sizes
                - url
                additionalProperties: false
                description: 'The school''s logo: `url` (the largest image) and `sizes`, every size LinkedIn serves.'
              schoolName:
                type: string
                description: The school.
              skills:
                type:
                - array
                - 'null'
